[package]
name = "claudesona"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { version = "1", features = ["preserve_order"] } # keep the user's settings.json key order
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# Image decode/resize is painfully slow unoptimized; keep our code debuggable, deps fast.
[profile.dev.package."*"]
opt-level = 3
