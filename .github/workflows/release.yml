name: release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build, test
# and publish all three systems as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
      - name: Package
        run: |
          mv dist/claudesona-Windows/claudesona.exe claudesona-windows-x64.exe
          # artifacts drop the executable bit; tar keeps it for users
          chmod +x dist/claudesona-macOS/claudesona dist/claudesona-Linux/claudesona
          tar -czf claudesona-macos-arm64.tar.gz -C dist/claudesona-macOS claudesona
          tar -czf claudesona-linux-x64.tar.gz -C dist/claudesona-Linux claudesona
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          claudesona-windows-x64.exe claudesona-macos-arm64.tar.gz claudesona-linux-x64.tar.gz
