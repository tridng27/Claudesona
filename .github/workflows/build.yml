name: build

on:
  push:
    branches: ['**']  # tags run this through release.yml instead, so they don't build twice
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: claudesona.exe
          - os: macos-latest
            file: claudesona
          - os: ubuntu-latest
            file: claudesona
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (ALSA for sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v6
        with:
          name: claudesona-${{ runner.os }}
          path: target/release/${{ matrix.file }}
